server {
    listen       80;
    server_name  localhost;

    # 带 hash 的静态资源：长缓存（内容变→文件名变，不怕过期）
    location /static/ {
        root   /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 前端 SPA 静态资源
    location / {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /index.html;
        # 入口页禁缓存——否则浏览器启发式缓存旧 index.html，新部署拿不到新 hash 资源名（2026-08-25 实测踩坑）
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 反代到后端容器（服务名 backend，Docker 内部网络 DNS 解析）
    # 注意：RuoYi-Vue3 生产构建默认前缀是 /prod-api（.env.production），
    # 不是规划文档 §7 提到的 /dev-api（那是本地 npm run dev 时 vite 的代理前缀）
    location /prod-api/ {
        proxy_pass         http://backend:7000/;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
