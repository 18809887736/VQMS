# VQMS AVC 合成数据生成器配置 —— 遥测点号映射
# 除 2003（真实派生点，2026-08-18 定号）外，其余 yc_num 均为"现场整定"占位号，现场补录后改本文件即可。
# 固定的 JS 引擎派生点（yc511/512/521/522、yx501）按数据源头（草稿）.md 缺口定义。

avc_onoff: 3009            # AVC 投退点（yc_data 1=投 / 0=退，阶跃保持）
remote_local: 2003         # 远方就地总（真实派生点 yx2003 = OR(yx12 正母, yx23 副母)，1=远方/0=就地；
                           # 取自对端配置库 JS_DATA 14「远方/就地合并」+ warn_info obj_num=2003 佐证）
main_busbar_num: 4001      # 主母线号指示点（yc_data 0/1）
realtime_v_busbar0: 4002   # 实时母线电压 busbar0（yc_data kV 带小数，如 234.25）
realtime_v_busbar1: 4003   # 实时母线电压 busbar1
active_power: 4004         # 总有功功率（yc_data，如 114800）

# JS 引擎派生点（固定建议点号，见 docs/外部DB/JS计算引擎说明.md）
grid_signal_main: 511      # yc511 正母并网：值 = 带电(1/0)×10 + 机组数(0/1/2)；≥10 即并网
grid_signal_aux: 512       # yc512 副母并网：同上
exit_reason_main: 521      # yc521 正母退出原因：0=未退 / 1=电网原因(免责) / 2=非电网(扣罚)
exit_reason_aux: 522       # yc522 副母退出原因：同上
exempt_flag: 501           # yx501 免考标志（全厂一个）：1=全设备顶满(免考) / 0=未顶满
